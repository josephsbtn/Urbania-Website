services:
  # Backend API
  - type: web
    name: urbania-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
    healthCheckPath: /api/public-service/hospitals
    
  # ML Service
  - type: web
    name: urbania-ml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
    rootDir: ml
